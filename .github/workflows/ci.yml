name: Verify contract compatibility

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    name: Verify contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25.0.5+8'
      - name: Verify consumer and provider contracts
        shell: pwsh
        run: ./scripts/verify.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: contract-test-reports-${{ matrix.os }}
          path: |
            bin/verification-*/reports/*.xml
            bin/verification-*/reports/observed-demo.txt
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os == 'Linux'
        with:
          python-version: '3.13.17'
      - name: Build and check source archive
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -B scripts/package_source.py $commit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: runner.os == 'Linux'
        with:
          go-version: '1.27.4'
          cache: false
      - name: Scan Git history for secrets
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner .
